services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
      POSTGRES_DB: campora
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campora -d campora"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://campora:${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}@postgres:5432/campora?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Configura DEMO_PASSWORD}
      JWT_EXPIRES_IN: 1d
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
